[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libero-max"
version = "0.1.0"
description = "A paired benchmark for dynamic robustness during robot execution"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://liberomax.github.io/"
Repository = "https://github.com/liberomax/LIBERO-MAX"
Paper = "https://arxiv.org/abs/2609.36518"

[project.scripts]
libero-max = "libero_max.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
